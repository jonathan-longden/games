<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="fshade" cx=".42" cy=".36" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
<radialGradient id="bgv" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
<linearGradient id="topsh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
<linearGradient id="hairsh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".6" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
<pattern id="ht" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><circle cx="1.2" cy="1.2" r=".62" fill="#000" opacity=".22"/></pattern>
<filter id="photo" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="1.7" result="b"/><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7"/><feColorMatrix type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 .36" result="n"/><feMerge><feMergeNode in="b"/><feMergeNode in="n"/></feMerge></filter>
</defs></svg>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="media.js"></script>
<script src="data2.js"></script>
